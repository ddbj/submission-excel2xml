# SRA XML（DRA のメタデータ）の要素と属性を、v3 のどこに置くか。
# tests/unit/schema/test_v3_sra_mapping.py が、全ての行の場所がモデルに実在すること、
# raw fixture の SRA XML の要素と属性が全てここにあること、sra_full.json に全ての行の
# 実例があることを確かめる。モデルを変えたら、ここも手で直す。
#
# 対象は SRA XSD 1.5d2 から 1.6.1 までの全版に現れる要素と属性に、D-way に保存された
# 全版の文書に現れるものを加えたもの。後者には、XSD 1.5 より前の登録にしかない要素も
# 含む。文書の種類ごとに、その根の要素から書く（*_SET は同じ種類を並べる入れ物なので
# 省く）。
#
# 値の読み方:
#   (container)          値を持たない入れ物。子が値を持つ
#   a.b[]                b は list。[] の中の語は注記で、要素の type と、relation なら
#                        target.db（relations[part_of sample] は type が part_of で
#                        target.db が sample の relation）
#   a.properties{key}    dict の key の値
#   ... (要素名が値)     子要素の名前がその値になる（PLATFORM/ILLUMINA → "ILLUMINA"）
#   ... (要素名を小文字にした値)
#                        同じく、小文字にして値にする（LIBRARY_LAYOUT/PAIRED → "paired"）
#   ... (種類の名前にした値)
#                        SRA のオブジェクトの型名を、record の種類の名前（record のキーの
#                        単数形）にする（STUDY → "project"、SAMPLE → "sample"）
#   relations[...]       ルートの relations。source は文書の根の要素
#
# 注記の付いた行は、XSD の一部の版にしかないか、XSD に無いもの。
# 数は D-way の全版の文書のうち、その要素を含むものの数。

submission:
  SUBMISSION:                                                  (container)
  SUBMISSION/@accession:                                       submission.accession
  SUBMISSION/@alias:                                           submission.alias
  SUBMISSION/@broker_name:                                     submission.broker_name
  SUBMISSION/@center_name:                                     submission.center_name
  SUBMISSION/@lab_name:                                        submission.sra.lab_name
  SUBMISSION/@submission_comment:                              submission.sra.submission_comment
  SUBMISSION/@submission_date:                                 submission.sra.submission_date
  SUBMISSION/@submission_id:                                   submission.sra.legacy.submission_id  # XSD に無い。D-way で 2 文書
  SUBMISSION/ACTIONS:                                          (container)
  SUBMISSION/ACTIONS/ACTION:                                   submission.sra.actions[]
  SUBMISSION/ACTIONS/ACTION/ADD:                               submission.sra.actions[].type (要素名が値)
  SUBMISSION/ACTIONS/ACTION/ADD/@notes:                        submission.sra.actions[].legacy.notes  # XSD に無い。D-way で 768 文書
  SUBMISSION/ACTIONS/ACTION/ADD/@schema:                       submission.sra.actions[].object_type
  SUBMISSION/ACTIONS/ACTION/ADD/@source:                       submission.sra.actions[].source
  SUBMISSION/ACTIONS/ACTION/HOLD:                              submission.sra.actions[].type (要素名が値)
  SUBMISSION/ACTIONS/ACTION/HOLD/@HoldForPeriod:               submission.sra.actions[].legacy.hold_for_period  # XSD に無い。D-way で 1,123 文書
  SUBMISSION/ACTIONS/ACTION/HOLD/@HoldUntilDate:               submission.sra.actions[].hold_until_date (@target の無い HOLD と RELEASE のうち最後のものなら、submission.hold_date にも同じ値)
  SUBMISSION/ACTIONS/ACTION/HOLD/@notes:                       submission.sra.actions[].legacy.notes  # XSD に無い。D-way で 495 文書
  SUBMISSION/ACTIONS/ACTION/HOLD/@target:                      submission.sra.actions[].target
  SUBMISSION/ACTIONS/ACTION/MODIFY:                            submission.sra.actions[].type (要素名が値)
  SUBMISSION/ACTIONS/ACTION/MODIFY/@schema:                    submission.sra.actions[].object_type
  SUBMISSION/ACTIONS/ACTION/MODIFY/@source:                    submission.sra.actions[].source
  SUBMISSION/ACTIONS/ACTION/MODIFY/@target:                    submission.sra.actions[].target  # XSD に無い。D-way で 2 文書
  SUBMISSION/ACTIONS/ACTION/PROTECT:                           submission.sra.actions[].type (要素名が値)
  SUBMISSION/ACTIONS/ACTION/RELEASE:                           submission.sra.actions[].type (要素名が値)
  SUBMISSION/ACTIONS/ACTION/RELEASE/@notes:                    submission.sra.actions[].legacy.notes  # XSD に無い。D-way で 6 文書
  SUBMISSION/ACTIONS/ACTION/RELEASE/@target:                   submission.sra.actions[].target
  SUBMISSION/ACTIONS/ACTION/SUPPRESS:                          submission.sra.actions[].type (要素名が値)
  SUBMISSION/ACTIONS/ACTION/SUPPRESS/@target:                  submission.sra.actions[].target
  SUBMISSION/ACTIONS/ACTION/VALIDATE:                          submission.sra.actions[].type (要素名が値)
  SUBMISSION/ACTIONS/ACTION/VALIDATE/@schema:                  submission.sra.actions[].object_type
  SUBMISSION/ACTIONS/ACTION/VALIDATE/@source:                  submission.sra.actions[].source
  SUBMISSION/CONTACTS:                                         (container)
  SUBMISSION/CONTACTS/CONTACT:                                 submission.sra.contacts[]
  SUBMISSION/CONTACTS/CONTACT/@inform_on_error:                submission.sra.contacts[].inform_on_error
  SUBMISSION/CONTACTS/CONTACT/@inform_on_status:               submission.sra.contacts[].inform_on_status
  SUBMISSION/CONTACTS/CONTACT/@name:                           submission.sra.contacts[].name
  SUBMISSION/FILES:                                            (container)  # XSD に無い。D-way で 536 文書
  SUBMISSION/FILES/FILE:                                       submission.sra.legacy.files[]  # XSD に無い。D-way で 536 文書
  SUBMISSION/FILES/FILE/@checksum:                             submission.sra.legacy.files[].checksum  # XSD に無い。D-way で 536 文書
  SUBMISSION/FILES/FILE/@checksum_method:                      submission.sra.legacy.files[].checksum_method  # XSD に無い。D-way で 536 文書
  SUBMISSION/FILES/FILE/@filename:                             submission.sra.legacy.files[].filename  # XSD に無い。D-way で 536 文書
  SUBMISSION/IDENTIFIERS:                                      (container)
  SUBMISSION/IDENTIFIERS/EXTERNAL_ID:                          submission.identifiers[external].value
  SUBMISSION/IDENTIFIERS/EXTERNAL_ID/@label:                   submission.identifiers[external].label
  SUBMISSION/IDENTIFIERS/EXTERNAL_ID/@namespace:               submission.identifiers[external].namespace
  SUBMISSION/IDENTIFIERS/PRIMARY_ID:                           submission.identifiers[primary].value
  SUBMISSION/IDENTIFIERS/PRIMARY_ID/@label:                    submission.identifiers[primary].label
  SUBMISSION/IDENTIFIERS/SECONDARY_ID:                         submission.identifiers[secondary].value
  SUBMISSION/IDENTIFIERS/SECONDARY_ID/@label:                  submission.identifiers[secondary].label
  SUBMISSION/IDENTIFIERS/SUBMITTER_ID:                         submission.identifiers[submitter].value
  SUBMISSION/IDENTIFIERS/SUBMITTER_ID/@label:                  submission.identifiers[submitter].label
  SUBMISSION/IDENTIFIERS/SUBMITTER_ID/@namespace:              submission.identifiers[submitter].namespace
  SUBMISSION/IDENTIFIERS/UUID:                                 submission.identifiers[uuid].value
  SUBMISSION/IDENTIFIERS/UUID/@label:                          submission.identifiers[uuid].label
  SUBMISSION/SUBMISSION_ATTRIBUTES:                            (container)
  SUBMISSION/SUBMISSION_ATTRIBUTES/SUBMISSION_ATTRIBUTE:       submission.attributes[]
  SUBMISSION/SUBMISSION_ATTRIBUTES/SUBMISSION_ATTRIBUTE/TAG:   submission.attributes[].name
  SUBMISSION/SUBMISSION_ATTRIBUTES/SUBMISSION_ATTRIBUTE/UNITS: submission.attributes[].unit
  SUBMISSION/SUBMISSION_ATTRIBUTES/SUBMISSION_ATTRIBUTE/VALUE: submission.attributes[].value
  SUBMISSION/SUBMISSION_LINKS:                                 (container)
  SUBMISSION/SUBMISSION_LINKS/SUBMISSION_LINK:                 relations[]
  SUBMISSION/SUBMISSION_LINKS/SUBMISSION_LINK/URL_LINK:        relations[reference]
  SUBMISSION/SUBMISSION_LINKS/SUBMISSION_LINK/URL_LINK/LABEL:  relations[reference].label
  SUBMISSION/SUBMISSION_LINKS/SUBMISSION_LINK/URL_LINK/URL:    relations[reference].target.url
  SUBMISSION/SUBMISSION_LINKS/SUBMISSION_LINK/XREF_LINK:       relations[xref]
  SUBMISSION/SUBMISSION_LINKS/SUBMISSION_LINK/XREF_LINK/DB:    relations[xref].target.db
  SUBMISSION/SUBMISSION_LINKS/SUBMISSION_LINK/XREF_LINK/ID:    relations[xref].target.id
  SUBMISSION/SUBMISSION_LINKS/SUBMISSION_LINK/XREF_LINK/LABEL: relations[xref].label
  SUBMISSION/TITLE:                                            submission.title

